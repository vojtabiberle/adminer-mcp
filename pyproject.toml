[project]
name = "adminer-mcp"
version = "0.1.0"
description = "MCP server that lets an agent work with a database through the Adminer web interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vojtěch Biberle" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "adminer", "postgresql", "database", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "selectolax>=1.0,<2",
    "sqlglot>=30,<31",
    "keyring>=25,<26",
    "pydantic>=2.14,<3",
]

[project.urls]
Homepage = "https://github.com/vojtabiberle/adminer-mcp"
Documentation = "https://github.com/vojtabiberle/adminer-mcp/tree/main/docs"
Issues = "https://github.com/vojtabiberle/adminer-mcp/issues"

[project.scripts]
adminer-mcp = "adminer_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.5,<2",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adminer_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["keyring.*", "selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Docker test environment (docker compose -f docker/compose.yml up)",
    "slow: long-running test, not run by default",
]
addopts = "-m 'not slow'"

[tool.pyright]
venvPath = "."
venv = ".venv"
